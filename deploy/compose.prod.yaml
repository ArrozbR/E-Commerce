services:
  app:
    image: ghcr.io/arrozbr/keycapstore-web:${APP_TAG:?defina APP_TAG no .env}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=keycapstore;Username=keycapstore;Password=${POSTGRES_PASSWORD}"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?defina STRIPE_SECRET_KEY no .env}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?defina STRIPE_WEBHOOK_SECRET no .env}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:?defina STRIPE_PUBLISHABLE_KEY no .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET no .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycapstore
      POSTGRES_USER: keycapstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycapstore -d keycapstore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data: